name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allows a manual deploy without pushing a commit.
  workflow_dispatch:

# Only one deploy at a time; a superseded run is cancelled rather than racing.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The synthetic builders are behind a non-default feature, so the default
      # clippy run above never sees them.
      - name: Clippy (synthetic feature)
        run: cargo clippy --workspace --all-targets --features palsave/synthetic -- -D warnings

      # NOTE: fixtures/ is gitignored (real saves contain SteamIDs and player names),
      # so the fixture-backed tests skip themselves here rather than failing. What
      # runs in CI is the synthetic coverage; the fixture tests are the local gate.
      # See CONTRIBUTING.md for how to add a fixture when the game format moves.
      - name: Test
        run: cargo test --workspace

      - name: Build for wasm32
        run: cargo build --workspace --target wasm32-unknown-unknown

  wasm:
    name: wasm boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs under Node rather than headless Chrome: these tests touch no DOM, only
      # wasm-bindgen marshalling. See ADR-005.md.
      - name: wasm-bindgen tests
        run: wasm-pack test --node crates/palsave-wasm

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Must come before the typecheck: src/lib/wasm/ is generated output and is
      # gitignored, so on a fresh checkout it doesn't exist yet and the worker's
      # import of it would fail to resolve.
      - name: Build wasm package
        run: npm run wasm

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npx vite build
        env:
          # Pages serves from /<repo>/, not the domain root.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Real saves are gitignored (SteamIDs, player names), so the browser suite
      # drives synthetic ones built by this crate's own writers.
      - name: Generate synthetic saves
        run: cargo run --bin gen-fixtures --features synthetic -- e2e/fixtures

      # BASE_PATH is deliberately NOT set: `vite preview` serves from `/`, and a
      # Pages-style `/<repo>/` base would 404 every asset under test.
      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Pages
    # The deploy gate: every check must pass first. A green site sitting on top of a
    # red test suite is exactly how the tools this project replaces went stale.
    needs: [rust, wasm, web, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
