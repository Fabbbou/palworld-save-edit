[package]
name = "palsave-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
palsave = { path = "../palsave" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
# The boundary tests build synthetic saves; see palsave/src/synthetic.rs.
palsave = { path = "../palsave", features = ["synthetic"] }
js-sys = "0.3.104"
wasm-bindgen-test = "0.3"
